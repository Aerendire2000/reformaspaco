# Trae las fotos nuevas de Instagram cada hora y publica la web en GitHub Pages.
name: Publicar web

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # cada hora
  workflow_dispatch:       # botón "Run workflow" para actualizar al momento

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar-web
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Traer publicaciones de Instagram
        if: env.IG_TOKEN != ''
        run: node scripts/actualizar-instagram.mjs

      - name: Guardar las fotos nuevas en el repositorio
        if: env.IG_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A trabajos.json img/ig
          if git diff --cached --quiet; then
            echo "Sin fotos nuevas."
          else
            git commit -m "Fotos de Instagram actualizadas"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
